<style>
	#newsModal .modal-body {
		overscroll-behavior: contain;
		-webkit-overflow-scrolling: touch;
	}

	/* Backdrop lebih gelap */
	.modal-backdrop.show {
		opacity: 0.7 !important;
		/* semakin besar semakin gelap */
		background-color: #000 !important;
	}

	/* Konten modal transparan tanpa kotak putih */
	#mediaModal .modal-content {
		background: rgba(0, 0, 0, 0.0) !important;
		/* transparan */
		border: none !important;
		box-shadow: none !important;
	}

	/* Supaya media tetap fokus */
	#mediaContainer img,
	#mediaContainer video {
		max-width: 100%;
		max-height: 90vh;
		border-radius: 10px;
		z-index: 9999;
	}
</style>
<section class="vs-hero overflow-hidden z-index-common parallax-wrap">
	<div class="vs-hero__ele1">
		<img class="parallax-element" src="assets/img/hero/h1-ele-1-1.svg" alt="ele" />
	</div>
	<div class="swiper vs-hero__active--zoom">
		<div class="swiper-wrapper" id="hero-slides"></div>
		<div class="vs-hero__direction">
			<div class="vs-swiper-button-next">
				<i class="fa-solid fa-arrow-right"></i>
			</div>
			<div class="vs-swiper-button-prev">
				<i class="fa-solid fa-arrow-left"></i>
			</div>
		</div>
	</div>
</section>

<section class="vs-section space space-extra-bottom mt-0 mb-4">
	<div class="container">
		<h2 class="vs-service--tab__title--main">Berita</h2>
		<h4 class="vs-service">Temukan berita dan informasi terbaru</h4>
		<div id="blog-list"> </div>
	</div>
</section>

<div class="modal fade" id="newsModal" tabindex="-1">
	<div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
		<div class="modal-content">
			<div class="modal-header">
				<h5 id="modalHeadline"></h5>
				<button class="btn-close" data-bs-dismiss="modal"></button>
			</div>
			<div class="modal-body">
				<img id="modalImage" class="img-fluid rounded mb-3">
				<p id="modalTitle"></p>
				<div id="modalNarration"></div>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="mediaModal" tabindex="-1">
	<div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
		<div class="modal-content text-center p-0">
			<div id="mediaContainer"></div>
		</div>
	</div>
</div>

<script>
	$(document).ready(function () {

		$.getJSON("/constants/news.json", function (data) {
			const container = $("#blog-list");
			container.empty();
			data.forEach(item => {
				const image = item.image || "/assets/img/placeholder.jpg";
				container.append(`
				<div class="vs-blog open-news mb-40"
					data-item='${JSON.stringify(item)}'>
					<img src="/assets/img/elements/vs-blog-ele1.svg"
						alt="blog elements"
						class="vs-blog__ele1">
					<div class="vs-blog__img--figure">
						<a href="javascript:void(0)">
							<img src="${image}"
								alt="news image"
								class="vs-blog__img">
						</a>
					</div>
					<div class="vs-blog__content">
						<div class="vs-blog__meta">
							<span>
								<i class="fa-regular fa-calendar-days"></i> ${item.date}
							</span>
							<span></span>
							<span>
								<i class="fa-regular fa-tag"></i> ${item.location}
							</span>
						</div>
						<h3 class="vs-blog__heading">${item.headline}</h3>
						<p class="vs-blog__desc">${item.title}</p>
						<span class="vs-blog__link">
							Read more <i class="fa-solid fa-arrow-right"></i>
						</span>
					</div>
				</div>
			`);
			});
		});

		$.getJSON("/constants/paralaxNews.json", function (data) {
			let slides = "";
			data.forEach(item => {
				const isVideo = /\.(mp4|webm|ogg)$/i.test(item.bg);
				slides += `
			<div class="swiper-slide">
				<div class="vs-hero" style="height:50vh;">
					${isVideo
						? `<video src="${item.bg}" muted loop autoplay
								class="open-media"
								data-src="${item.bg}"
								style="width:100%;height:100%;object-fit:cover;cursor:pointer;"></video>`
						: `<img src="${item.bg}"
								class="open-media"
								data-src="${item.bg}"
								style="width:100%;height:100%;object-fit:cover;cursor:pointer;">`
					}
				</div>
			</div>`;
			});
			$("#hero-slides").html(slides);
			new Swiper(".vs-hero__active--zoom", {
				loop: true,
				speed: 1000,
				navigation: {
					nextEl: ".vs-swiper-button-next",
					prevEl: ".vs-swiper-button-prev"
				}
			});
		});

		$(document).on("click", ".open-media", function () {
			const src = $(this).data("src");
			const container = $("#mediaContainer");
			container.empty();
			if (/\.(mp4|webm|ogg)$/i.test(src)) {
				container.html(`
				<video id="modalVideo" controls autoplay
					style="max-width:100%;max-height:90vh;">
					<source src="${src}">
				</video>
			`);
			} else {
				container.html(`
				<img src="${src}"
					style="max-width:100%;max-height:90vh;">
			`);
			}
			new bootstrap.Modal("#mediaModal").show();
		});
		$("#mediaModal").on("hidden.bs.modal", function () {
			const video = document.getElementById("modalVideo");
			if (video) {
				video.pause();
				video.currentTime = 0;
			}
			$("#mediaContainer").empty();
		});

		let newsModal = null;
		let scrollTop = 0;
		$(document).on("click", ".open-news", function (e) {
			e.preventDefault();
			const item = $(this).data("item");
			$("#modalHeadline").text(item.headline || "");
			$("#modalTitle").text(item.title || "");
			$("#modalNarration").html(
				(item.narration || "").replace(/\n/g, "<br>")
			);
			$("#modalImage").attr(
				"src",
				item.image || "/assets/img/placeholder.jpg"
			);
			const modalEl = document.getElementById("newsModal");
			if (!newsModal) {
				newsModal = new bootstrap.Modal(modalEl, {
					backdrop: true,
					keyboard: true,
					focus: true
				});
				modalEl.addEventListener("show.bs.modal", () => {
					scrollTop = window.scrollY;
					document.body.style.position = "fixed";
					document.body.style.top = `-${scrollTop}px`;
					document.body.style.width = "100%";
				});
				modalEl.addEventListener("hidden.bs.modal", () => {
					document.body.style.position = "";
					document.body.style.top = "";
					document.body.style.width = "";
					window.scrollTo(0, scrollTop);
				});
			}
			newsModal.show();
		});
	});
</script>
